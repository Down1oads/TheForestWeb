(function () {
  var realFetch = window.fetch.bind(window), manifest = null;
  function getManifest() { return manifest || (manifest = realFetch('split-files.json').then(function (r) { return r.json(); })); }
  var bigDone = 0, bigTotal = 0;
  function progress(frac) { if (window.__tfProgress) window.__tfProgress(Math.min(0.97, frac)); }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var clean = url.split('?')[0];
    return getManifest().then(function (m) {
      var key = Object.keys(m).filter(function (k) { return clean.slice(-k.length) === k; })[0];
      if (!key) return realFetch(input, init);
      var info = m[key], done = 0, total = info.size, ckey = 'https://forest.local/' + key + '/' + info.hash, cache = null;
      var isWasm = key.slice(-5) === '.wasm';
      var mime = isWasm ? 'application/wasm' : 'application/octet-stream';
      function respond(blob) { return new Response(blob, { status: 200, headers: { 'Content-Length': String(blob.size), 'Content-Type': mime } }); }
      function fetchParts() {
        return Promise.all(info.parts.map(function (p) {
          return realFetch(p).then(function (r) {
            if (!r.ok) throw new Error('could not load ' + p);
            return r.arrayBuffer();
          }).then(function (b) { done += b.byteLength; progress(done / total); return b; });
        })).then(function (bufs) {
          var blob = new Blob(bufs, { type: mime });
          if (cache) { cache.keys().then(function (ks) { ks.forEach(function (k) { if (k.url.indexOf('https://forest.local/' + key + '/') === 0) cache.delete(k); }); return cache.put(ckey, respond(blob)); }).catch(function () {}); }
          return respond(blob);
        });
      }
      if (!window.caches) return fetchParts();
      return caches.open('forest-data').then(function (c) { cache = c; return c.match(ckey); }).then(function (hit) {
        if (hit) { progress(1); return hit.blob().then(respond); }
        return fetchParts();
      }).catch(function () { return fetchParts(); });
    });
  };
})();
</script>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build_web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/build_web.data",
        frameworkUrl: buildUrl + "/build_web.framework.js",
        codeUrl: buildUrl + "/build_web.wasm",
        symbolsUrl: buildUrl + "/build_web.symbols.json",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Port",
        productName: "The Forest",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {

      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%"; if (window.__tfProgress) window.__tfProgress(progress);
              }).then((unityInstance) => {

              });
            };
